# Medium cap: 100 .rsr per hour or 300 per day per IP -> 24 h ban (web ports only)
[rsr-hour]
enabled  = true
filter   = caddy-rsr
logpath  = /var/log/caddy/access.log
backend  = polling
port     = http,https
findtime = 3600
maxretry = 100
bantime  = 86400

[rsr-day]
enabled  = true
filter   = caddy-rsr
logpath  = /var/log/caddy/access.log
backend  = polling
port     = http,https
findtime = 86400
maxretry = 300
bantime  = 86400
